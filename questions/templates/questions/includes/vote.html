<div class="pk-vote">
    <button class="pk-vote-btn pk-vote-up" type="button" aria-label="Нравится" disabled>
        <span class="material-symbols-outlined" aria-hidden="true">arrow_drop_up</span>
    </button>
    <span class="pk-vote-count">{{ rating }}</span>
    <button class="pk-vote-btn pk-vote-down" type="button" aria-label="Не нравится" disabled>
        <span class="material-symbols-outlined" aria-hidden="true">arrow_drop_down</span>
    </button>
</div>
