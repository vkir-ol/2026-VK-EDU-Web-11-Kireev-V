{% extends "core/base.html" %}

{% block title %}Войти — AskPupkin{% endblock %}

{% block content %}
    <div class="pk-card pk-form-narrow p-3 p-md-4 mx-auto">

        <h1 class="h3 mb-3">Log in</h1>

        <!-- Ошибка формы -->
        <div class="alert alert-danger" role="alert">
            Вы ввели неправильный email или пароль.
        </div>

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control is-invalid" type="email" id="email" name="email" maxlength="100" value="dr.pepper@example" autocomplete="email" required>
                <div class="invalid-feedback">Вы ввели невалидный email.</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" maxlength="64" autocomplete="current-password" required>
                <div class="form-text">Пароль чувствителен к регистру букв.</div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                <label class="form-check-label" for="remember">Запомнить меня</label>
            </div>

            <div class="d-grid">
                <button class="btn btn-ask" type="submit">Log in</button>
            </div>

        </form>

        <p class="text-center mt-3 mb-0">
            Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
        </p>

    </div>
{% endblock %}
