<div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control{% if error %} is-invalid{% endif %}" type="email" id="email" name="email" maxlength="100" value="{{ value }}" autocomplete="email" required>
    {% if error %}
        <div class="invalid-feedback">{{ error }}</div>
    {% endif %}
    {% if help %}
        <div class="form-text">{{ help }}</div>
    {% endif %}
</div>
