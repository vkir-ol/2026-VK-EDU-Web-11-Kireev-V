{% load static %}
<header class="pk-header py-3">
    <div class="container">
        <div class="row align-items-center g-3">

            <div class="col-auto">
                <a class="pk-logo" href="{% url 'index' %}">AskPupkin</a>
            </div>

            <div class="col-12 col-md order-3 order-md-2">
                <form class="d-flex" role="search" action="{% url 'index' %}" method="get">
                    <input class="form-control" type="search" name="q" placeholder="Search" aria-label="Search">
                </form>
            </div>

            <div class="col-auto order-2 order-md-3">
                <a class="btn btn-ask" href="{% url 'ask' %}">Ask!</a>
            </div>

            <div class="col-auto ms-auto order-2 order-md-4">
                {% if auth_user %}
                    <!-- авторизованный пользователь -->
                    <div class="d-flex align-items-center gap-2">
                        <img class="pk-avatar" src="{% static auth_user.avatar %}" alt="Аватар {{ auth_user.nickname }}" width="40" height="40">
                        <div class="lh-sm">
                            <div class="pk-user-name">{{ auth_user.nickname }}</div>
                            <a class="small" href="{% url 'profile' %}">settings</a>
                            <a class="small ms-2" href="{% url 'login' %}">log out</a>
                        </div>
                    </div>
                {% else %}
                    <!-- неавторизованный пользователь -->
                    <a href="{% url 'login' %}">log in</a>
                    <a class="ms-2" href="{% url 'signup' %}">register</a>
                {% endif %}
            </div>

        </div>
    </div>
</header>
