<section class="mb-4">
    <h2 class="pk-side-title">Популярные теги</h2>
    {% for tag in popular_tags %}
        <a href="{% url 'tag' tag %}">{{ tag }}</a>
    {% endfor %}
</section>

<section>
    <h2 class="pk-side-title">Лучшие пользователи</h2>
    <ul class="list-unstyled">
        {% for member in best_members %}
            <li><a href="{% url 'profile' %}">{{ member }}</a></li>
        {% endfor %}
    </ul>
</section>
