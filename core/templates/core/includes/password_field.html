<div class="mb-3">
    <label class="form-label" for="{{ id }}">{{ label }}</label>
    <input class="form-control{% if error %} is-invalid{% endif %}" type="password" id="{{ id }}" name="{{ id }}" minlength="8" maxlength="64" autocomplete="{{ autocomplete }}" required>
    {% if error %}
        <div class="invalid-feedback">{{ error }}</div>
    {% endif %}
    {% if help %}
        <div class="form-text">{{ help }}</div>
    {% endif %}
</div>
