{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AskPupkin — вопросы и ответы{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'core/img/icon1.svg' %}">
    <link rel="icon" type="image/png" href="{% static 'core/img/icon1.png' %}">
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/material-symbols.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

    {% include "core/includes/header.html" %}

    <main class="container my-4 flex-grow-1">
        <div class="row g-4">

            <section class="col-12 col-lg-8">
                {% block content %}{% endblock %}
            </section>

            <aside class="col-12 col-lg-4">
                {% include "core/includes/sidebar.html" %}
            </aside>

        </div>
    </main>

    <footer class="pk-footer py-3 text-center">
        <div class="container">© 2026 AskPupkin</div>
    </footer>

    <script src="{% static 'core/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
